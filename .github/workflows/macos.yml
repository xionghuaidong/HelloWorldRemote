name: macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GameViewer
        shell: bash
        run: |
            package_url="https://a56.gdl.netease.com/uuyc_4.35.0.pkg"
            package_path="${GITHUB_WORKSPACE}/uuyc_4.35.0.pkg"
            curl -L -o ${package_path} ${package_url}
            sudo /usr/sbin/installer -verboseR -pkg ${package_path} -target /

      - name: Launch GameViewer
        shell: bash
        run: |
            ls -l /Applications/UURemote.app/Contents/MacOS/UURemote
            brew install coreutils
            gtimeout 60s /Applications/UURemote.app/Contents/MacOS/UURemote >/dev/nul 2>&1 &

            for ((i=1; i<=120; i++))
            do
                echo "Waiting deviceId [$i/120] ..."
                if device_id="$(/Applications/UURemote.app/Contents/Helpers/uuyc-cli assist id)"
                then
                    if [ -n "$device_id" ]
                    then
                        echo "deviceId: $device_id"
                        break
                    fi
                    echo "设备 ID 为空，500 毫秒后重试" >&2
                else
                    status="$?"
                    echo "CLI 失败，退出码 $status，500 毫秒后重试" >&2
                fi
                sleep 0.5
            done

            for ((i=1; i<=120; i++))
            do
                echo "Waiting customCode [$i/120] ..."
                if output="$(/Applications/UURemote.app/Contents/Helpers/uuyc-cli assist set-code johnDOE123 )"
                then
                    echo "customCode: $output"
                    break
                else
                    status="$?"
                    echo "CLI 失败，退出码 $status，500 毫秒后重试" >&2
                fi
                sleep 0.5
            done

            for ((i=1; i<=120; i++))
            do
                echo "Waiting allow [$i/120] ..."
                if output="$(/Applications/UURemote.app/Contents/Helpers/uuyc-cli assist allow on)"
                then
                    echo "allow: $output"
                    break
                else
                    status="$?"
                    echo "CLI 失败，退出码 $status，500 毫秒后重试" >&2
                fi
                sleep 0.5
            done


            console_uid="$(stat -f '%u' /dev/console)"

            echo "=== macOS ==="
            /usr/bin/sw_vers

            sudo launchctl asuser "$console_uid" \
              sudo -u "#$console_uid" \
              /usr/bin/osascript <<'APPLESCRIPT'
            on attributeText(uiItem, attributeName)
                tell application "System Events"
                    try
                        set attributeValue to value of attribute attributeName of uiItem

                        if attributeValue is not missing value then
                            return attributeValue as text
                        end if
                    end try
                end tell

                return ""
            end attributeText

            tell application "System Events"
                tell process "System Settings"
                    if not (exists window 1) then
                        error "System Settings window not found"
                    end if

                    set outputLines to {}

                    try
                        set windowPosition to position of window 1
                        set windowSize to size of window 1

                        set end of outputLines to "WINDOW position=" & ¬
                            (item 1 of windowPosition as text) & "," & ¬
                            (item 2 of windowPosition as text) & ¬
                            " size=" & ¬
                            (item 1 of windowSize as text) & "x" & ¬
                            (item 2 of windowSize as text)
                    end try

                    set allItems to entire contents of window 1
                    set buttonNumber to 0

                    repeat with uiItem in allItems
                        try
                            if (role of uiItem as text) is "AXButton" then
                                set buttonNumber to buttonNumber + 1

                                set itemPosition to position of uiItem
                                set itemSize to size of uiItem

                                set parentRole to ""
                                set parentDescription to ""

                                try
                                    set parentItem to parent of uiItem
                                    set parentRole to role of parentItem as text
                                    set parentDescription to my attributeText(parentItem, "AXDescription")
                                end try

                                set itemLine to "#" & buttonNumber
                                set itemLine to itemLine & " position=" & (item 1 of itemPosition as text)
                                set itemLine to itemLine & "," & (item 2 of itemPosition as text)
                                set itemLine to itemLine & " size=" & (item 1 of itemSize as text)
                                set itemLine to itemLine & "x" & (item 2 of itemSize as text)
                                set itemLine to itemLine & " enabled=" & my attributeText(uiItem, "AXEnabled")
                                set itemLine to itemLine & " title=[" & my attributeText(uiItem, "AXTitle") & "]"
                                set itemLine to itemLine & " description=[" & my attributeText(uiItem, "AXDescription") & "]"
                                set itemLine to itemLine & " help=[" & my attributeText(uiItem, "AXHelp") & "]"
                                set itemLine to itemLine & " identifier=[" & my attributeText(uiItem, "AXIdentifier") & "]"
                                set itemLine to itemLine & " subrole=[" & my attributeText(uiItem, "AXSubrole") & "]"
                                set itemLine to itemLine & " roleDescription=[" & my attributeText(uiItem, "AXRoleDescription") & "]"
                                set itemLine to itemLine & " parentRole=[" & parentRole & "]"
                                set itemLine to itemLine & " parentDescription=[" & parentDescription & "]"

                                set end of outputLines to itemLine
                            end if
                        end try
                    end repeat

                    set end of outputLines to "BUTTON COUNT=" & buttonNumber

                    set previousDelimiters to AppleScript's text item delimiters
                    set AppleScript's text item delimiters to linefeed
                    set outputText to outputLines as text
                    set AppleScript's text item delimiters to previousDelimiters

                    return outputText
                end tell
            end tell
            APPLESCRIPT


            sleep 300
