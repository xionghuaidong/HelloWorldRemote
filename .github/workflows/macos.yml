name: macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GameViewer
        shell: bash
        run: |
            package_url="https://a56.gdl.netease.com/uuyc_4.35.0.pkg"
            package_path="${GITHUB_WORKSPACE}/uuyc_4.35.0.pkg"
            curl -L -o ${package_path} ${package_url}
            sudo /usr/sbin/installer -verboseR -pkg ${package_path} -target /

      - name: Launch GameViewer
        shell: bash
        run: |
            ls -l /Applications/UURemote.app/Contents/MacOS/UURemote
            brew install coreutils
            gtimeout 60s /Applications/UURemote.app/Contents/MacOS/UURemote >/dev/nul 2>&1 &

            for ((i=1; i<=120; i++))
            do
                echo "Waiting deviceId [$i/120] ..."
                if device_id="$(/Applications/UURemote.app/Contents/Helpers/uuyc-cli assist id)"
                then
                    if [ -n "$device_id" ]
                    then
                        echo "deviceId: $device_id"
                        break
                    fi
                    echo "设备 ID 为空，500 毫秒后重试" >&2
                else
                    status="$?"
                    echo "CLI 失败，退出码 $status，500 毫秒后重试" >&2
                fi
                sleep 0.5
            done

            for ((i=1; i<=120; i++))
            do
                echo "Waiting customCode [$i/120] ..."
                if output="$(/Applications/UURemote.app/Contents/Helpers/uuyc-cli assist set-code johnDOE123 )"
                then
                    echo "customCode: $output"
                    break
                else
                    status="$?"
                    echo "CLI 失败，退出码 $status，500 毫秒后重试" >&2
                fi
                sleep 0.5
            done

            for ((i=1; i<=120; i++))
            do
                echo "Waiting allow [$i/120] ..."
                if output="$(/Applications/UURemote.app/Contents/Helpers/uuyc-cli assist allow on)"
                then
                    echo "allow: $output"
                    break
                else
                    status="$?"
                    echo "CLI 失败，退出码 $status，500 毫秒后重试" >&2
                fi
                sleep 0.5
            done


            APP="/Applications/UURemote.app"
            console_uid="$(stat -f '%u' /dev/console)"

            run_in_gui() {
                sudo launchctl asuser "$console_uid" \
                    sudo -u "#$console_uid" \
                    "$@"
            }

            # 关闭 UU，避免开启权限后出现“退出并重新打开”对话框
            run_in_gui /usr/bin/killall UURemote 2>/dev/null || true
            sleep 2

            run_in_gui /usr/bin/open \
              'x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture'

            sleep 5

            run_in_gui /usr/bin/osascript <<'APPLESCRIPT'
            on elementText(uiItem)
                tell application "System Events"
                    set combinedText to ""

                    try
                        set combinedText to combinedText & " " & (name of uiItem as text)
                    end try

                    try
                        set combinedText to combinedText & " " & (description of uiItem as text)
                    end try

                    try
                        set combinedText to combinedText & " " & (help of uiItem as text)
                    end try

                    try
                        set itemRole to role of uiItem as text
                        if itemRole is "AXStaticText" then
                            set combinedText to combinedText & " " & (value of uiItem as text)
                        end if
                    end try

                    return combinedText
                end tell
            end elementText

            on containsUU(uiItem)
                set labelText to my elementText(uiItem)

                if labelText contains "UURemote" then return true
                if labelText contains "UU远程" then return true
                if labelText contains "UU 远程" then return true
                if labelText contains "网易UU" then return true
                if labelText contains "UU" then return true

                return false
            end containsUU

            on operateSwitch(uiItem)
                tell application "System Events"
                    try
                        set itemRole to role of uiItem as text

                        if itemRole is not "AXCheckBox" and itemRole is not "AXSwitch" then
                            return ""
                        end if

                        set oldValue to value of uiItem

                        if oldValue is true or oldValue is 1 or (oldValue as text) is "1" then
                            return "权限已经开启"
                        end if

                        perform action "AXPress" of uiItem
                        delay 2

                        set newValue to value of uiItem

                        if newValue is true or newValue is 1 or (newValue as text) is "1" then
                            return "权限已成功开启"
                        end if

                        error "已经点击开关，但状态仍未开启，可能出现了认证或确认窗口"
                    end try
                end tell

                return ""
            end operateSwitch

            tell application "System Events"
                tell process "System Settings"
                    set frontmost to true

                    if not (exists window 1) then
                        error "未找到系统设置窗口"
                    end if

                    set allItems to entire contents of window 1
                    set targetLabel to missing value

                    -- 首先尝试寻找自身带有 UU 名称的开关
                    repeat with uiItem in allItems
                        try
                            if my containsUU(uiItem) then
                                set toggleResult to my operateSwitch(uiItem)

                                if toggleResult is not "" then
                                    return toggleResult
                                end if

                                if targetLabel is missing value then
                                    set targetLabel to contents of uiItem
                                end if
                            end if
                        end try
                    end repeat

                    if targetLabel is missing value then
                        error "没有在录屏权限页面找到网易 UU 远程"
                    end if

                    -- 如果名称和开关是同一行的不同元素，向上查找所在容器
                    set containerRef to parent of targetLabel

                    repeat with searchDepth from 1 to 4
                        try
                            set containerRole to role of containerRef as text

                            if containerRole is "AXWindow" or containerRole is "AXScrollArea" then
                                exit repeat
                            end if

                            set candidates to entire contents of containerRef
                            set switchesFound to {}

                            repeat with candidate in candidates
                                try
                                    set candidateRole to role of candidate as text

                                    if candidateRole is "AXCheckBox" or candidateRole is "AXSwitch" then
                                        set end of switchesFound to contents of candidate
                                    end if
                                end try
                            end repeat

                            if (count of switchesFound) is 1 then
                                set toggleResult to my operateSwitch(item 1 of switchesFound)

                                if toggleResult is not "" then
                                    return toggleResult
                                end if
                            end if

                            set containerRef to parent of containerRef
                        on error
                            exit repeat
                        end try
                    end repeat

                    error "找到了网易 UU 远程文字，但无法定位对应的权限开关"
                end tell
            end tell
            APPLESCRIPT

            sleep 2

            run_in_gui /usr/bin/open "$APP"

            echo "UURemote 已重新启动"


            sleep 300
