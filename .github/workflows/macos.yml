name: macOS

on:
  workflow_dispatch:
    inputs:
      debug_level:
        description: UURemote diagnostic level (0=fast, 1=screenshots, 2=idempotency, 3=live sampling)
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
      wait_connections_seconds:
        description: Seconds to wait for remote connections (0-21000)
        required: true
        default: 300
        type: number

permissions:
  contents: write

jobs:
  run:
    runs-on: macos-latest
    env:
      UUREMOTE_DEBUG: ${{ inputs.debug_level || '0' }}
      UUREMOTE_WAIT_CONNECTIONS_SECONDS: ${{ inputs.wait_connections_seconds }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test shutdown-aware wait
        if: env.UUREMOTE_DEBUG != '0'
        shell: bash
        run: |
            .github/workflows/apple.sh self-test-wait-connections

      - name: Test device ID logging
        if: env.UUREMOTE_DEBUG != '0'
        shell: bash
        run: |
            /bin/bash tests/test_macos_device_id_logging.sh
            /bin/bash tests/test_macos_cli_output_redaction.sh
            python -m unittest tests.test_uuremote_wait tests.test_uuremote_desktop_finalization -v
