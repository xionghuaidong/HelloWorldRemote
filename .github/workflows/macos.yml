name: macOS

on:
  workflow_dispatch:
    inputs:
      debug_level:
        description: UURemote diagnostic level (0=fast, 1=screenshots, 2=idempotency, 3=live sampling)
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"

permissions:
  contents: write

jobs:
  run:
    runs-on: macos-latest
    env:
      UUREMOTE_DEBUG: ${{ inputs.debug_level || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GameViewer
        shell: bash
        run: |
            package_url="https://a56.gdl.netease.com/uuyc_4.35.0.pkg"
            package_path="${GITHUB_WORKSPACE}/uuyc_4.35.0.pkg"
            curl -L -o ${package_path} ${package_url}
            sudo /usr/sbin/installer -verboseR -pkg ${package_path} -target /

      - name: Launch GameViewer
        shell: bash
        run: |
            ls -l /Applications/UURemote.app/Contents/MacOS/UURemote
            brew install coreutils
            gtimeout 60s /Applications/UURemote.app/Contents/MacOS/UURemote >/dev/nul 2>&1 &

            for ((i=1; i<=120; i++))
            do
                echo "Waiting deviceId [$i/120] ..."
                if device_id="$(/Applications/UURemote.app/Contents/Helpers/uuyc-cli assist id)"
                then
                    if [ -n "$device_id" ]
                    then
                        echo "deviceId: $device_id"
                        break
                    fi
                    echo "设备 ID 为空，500 毫秒后重试" >&2
                else
                    status="$?"
                    echo "CLI 失败，退出码 $status，500 毫秒后重试" >&2
                fi
                sleep 0.5
            done

            for ((i=1; i<=120; i++))
            do
                echo "Waiting customCode [$i/120] ..."
                if output="$(/Applications/UURemote.app/Contents/Helpers/uuyc-cli assist set-code johnDOE123 )"
                then
                    echo "customCode: $output"
                    break
                else
                    status="$?"
                    echo "CLI 失败，退出码 $status，500 毫秒后重试" >&2
                fi
                sleep 0.5
            done

            .github/workflows/apple.sh

      - name: Verify permission idempotency
        if: env.UUREMOTE_DEBUG == '2' || env.UUREMOTE_DEBUG == '3'
        shell: bash
        run: |
            .github/workflows/apple.sh

      - name: Keep runner alive and capture diagnostics
        if: success() && env.UUREMOTE_DEBUG == '3'
        shell: bash
        run: |
            for ((sample=1; sample<=20; sample++))
            do
                printf -v label 'live-%02d' "$sample"
                echo "Capturing $label ..."
                .github/workflows/apple.sh snapshot "$label"
                sleep 15
            done

      - name: Upload permission screenshots
        if: always() && env.UUREMOTE_DEBUG != '0'
        uses: actions/upload-artifact@v4
        with:
          name: uuremote-permission-screenshots
          path: ${{ runner.temp }}/uuremote-permission-screenshots/
          if-no-files-found: error
