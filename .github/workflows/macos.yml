name: macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GameViewer
        shell: bash
        run: |
            package_url="https://a56.gdl.netease.com/uuyc_4.35.0.pkg"
            package_path="${GITHUB_WORKSPACE}/uuyc_4.35.0.pkg"
            curl -L -o ${package_path} ${package_url}
            sudo /usr/sbin/installer -verboseR -pkg ${package_path} -target /

      - name: Launch GameViewer
        shell: bash
        run: |
            ls -l /Applications/UURemote.app/Contents/MacOS/UURemote
            brew install coreutils
            gtimeout 60s /Applications/UURemote.app/Contents/MacOS/UURemote >/dev/nul 2>&1 &

            for ((i=1; i<=120; i++))
            do
                echo "Waiting deviceId [$i/120] ..."
                if device_id="$(/Applications/UURemote.app/Contents/Helpers/uuyc-cli assist id)"
                then
                    if [ -n "$device_id" ]
                    then
                        echo "deviceId: $device_id"
                        break
                    fi
                    echo "设备 ID 为空，500 毫秒后重试" >&2
                else
                    status="$?"
                    echo "CLI 失败，退出码 $status，500 毫秒后重试" >&2
                fi
                sleep 0.5
            done

            for ((i=1; i<=120; i++))
            do
                echo "Waiting customCode [$i/120] ..."
                if output="$(/Applications/UURemote.app/Contents/Helpers/uuyc-cli assist set-code johnDOE123 )"
                then
                    echo "customCode: $output"
                    break
                else
                    status="$?"
                    echo "CLI 失败，退出码 $status，500 毫秒后重试" >&2
                fi
                sleep 0.5
            done

            for ((i=1; i<=120; i++))
            do
                echo "Waiting allow [$i/120] ..."
                if output="$(/Applications/UURemote.app/Contents/Helpers/uuyc-cli assist allow on)"
                then
                    echo "allow: $output"
                    break
                else
                    status="$?"
                    echo "CLI 失败，退出码 $status，500 毫秒后重试" >&2
                fi
                sleep 0.5
            done


            APP="/Applications/UURemote.app"
            console_uid="$(stat -f '%u' /dev/console)"

            run_in_gui() {
                sudo launchctl asuser "$console_uid" \
                    sudo -u "#$console_uid" \
                    "$@"
            }

            run_in_gui /usr/bin/open \
              'x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture'

            sleep 5

            run_in_gui /usr/bin/osascript <<'APPLESCRIPT'
            on attributeText(uiItem, attributeName)
                tell application "System Events"
                    try
                        set attributeValue to value of attribute attributeName of uiItem

                        if attributeValue is not missing value then
                            return attributeValue as text
                        end if
                    end try
                end tell

                return ""
            end attributeText

            on isSwitch(uiItem)
                tell application "System Events"
                    try
                        set itemRole to role of uiItem as text

                        if itemRole is "AXCheckBox" or itemRole is "AXSwitch" then
                            return true
                        end if

                        if itemRole is "AXButton" then
                            set itemDescription to my attributeText(uiItem, "AXDescription")

                            if itemDescription contains "switch" then
                                return true
                            end if
                        end if
                    end try
                end tell

                return false
            end isSwitch

            on switchEnabled(uiItem)
                tell application "System Events"
                    try
                        set itemValue to value of uiItem

                        if itemValue is true then return true
                        if itemValue is 1 then return true
                        if (itemValue as text) is "1" then return true
                    end try
                end tell

                return false
            end switchEnabled

            tell application "System Events"
                tell process "System Settings"
                    set frontmost to true

                    if not (exists window 1) then
                        error "System Settings window not found"
                    end if

                    set allItems to entire contents of window 1
                    set visibleText to ""
                    set addCandidates to {}
                    set buttonDump to ""

                    repeat with uiItem in allItems
                        try
                            set itemRole to role of uiItem as text

                            if itemRole is "AXStaticText" or itemRole is "AXHeading" then
                                set visibleText to visibleText & " " & my attributeText(uiItem, "AXTitle")
                                set visibleText to visibleText & " " & my attributeText(uiItem, "AXValue")
                            end if

                            if itemRole is "AXButton" then
                                set buttonText to ""
                                set buttonText to buttonText & " " & my attributeText(uiItem, "AXTitle")
                                set buttonText to buttonText & " " & my attributeText(uiItem, "AXDescription")
                                set buttonText to buttonText & " " & my attributeText(uiItem, "AXHelp")
                                set buttonText to buttonText & " " & my attributeText(uiItem, "AXIdentifier")

                                set buttonDump to buttonDump & linefeed & "[" & buttonText & "]"

                                if buttonText contains "Add" or buttonText contains "add" or buttonText contains "+" then
                                    set end of addCandidates to contents of uiItem
                                end if
                            end if
                        end try
                    end repeat

                    if visibleText does not contain "Screen" or visibleText does not contain "Recording" then
                        error "当前不是 Screen & System Audio Recording 页面：" & visibleText
                    end if

                    set addCount to count of addCandidates

                    if addCount is 0 then
                        error "找不到 Add 按钮。页面按钮：" & buttonDump
                    end if

                    if addCount is not 1 then
                        error "找到 " & addCount & " 个 Add 候选按钮，为避免误操作已停止。页面按钮：" & buttonDump
                    end if

                    perform action "AXPress" of item 1 of addCandidates
                    delay 2

                    -- 标准文件选择器：打开“前往文件夹”
                    keystroke "g" using {command down, shift down}
                    delay 1

                    keystroke "/Applications/UURemote.app"
                    delay 1

                    -- 确认路径
                    key code 36
                    delay 2

                    -- 点击文件选择器中的 Open
                    key code 36
                    delay 4

                    -- 等待应用出现在权限列表
                    set switchCandidates to {}

                    repeat 30 times
                        set switchCandidates to {}
                        set refreshedItems to entire contents of window 1

                        repeat with uiItem in refreshedItems
                            if my isSwitch(uiItem) then
                                set end of switchCandidates to contents of uiItem
                            end if
                        end repeat

                        if (count of switchCandidates) is greater than 0 then
                            exit repeat
                        end if

                        delay 0.5
                    end repeat

                    set switchCount to count of switchCandidates

                    if switchCount is 0 then
                        error "已完成文件选择，但 UURemote 仍未出现在权限列表"
                    end if

                    if switchCount is not 1 then
                        error "添加后发现 " & switchCount & " 个权限开关，为避免误操作已停止"
                    end if

                    set targetSwitch to item 1 of switchCandidates

                    -- 先结束 UU，避免出现“Quit & Reopen”确认框
                    do shell script "/usr/bin/killall UURemote >/dev/null 2>&1 || true"
                    delay 1

                    if my switchEnabled(targetSwitch) then
                        return "UURemote 已加入列表，录屏权限已经开启"
                    end if

                    perform action "AXPress" of targetSwitch
                    delay 2

                    if my switchEnabled(targetSwitch) then
                        return "UURemote 已加入列表并成功开启录屏权限"
                    end if

                    error "UURemote 已加入列表，但点击后权限仍未开启，可能出现了认证窗口"
                end tell
            end tell
            APPLESCRIPT

            sleep 2
            run_in_gui /usr/bin/open "$APP"

            echo "UURemote 已重新启动"


            sleep 300
