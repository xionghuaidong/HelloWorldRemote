name: macOS

on:
  workflow_dispatch:
    inputs:
      debug_level:
        description: UURemote diagnostic level (0=fast, 1=screenshots, 2=idempotency, 3=live sampling)
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
      wait_connections_seconds:
        description: Seconds to wait for remote connections (0-21000)
        required: true
        default: 300
        type: number

permissions:
  contents: write

jobs:
  run:
    runs-on: macos-latest
    env:
      UUREMOTE_DEBUG: ${{ inputs.debug_level || '0' }}
      UUREMOTE_WAIT_CONNECTIONS_SECONDS: ${{ inputs.wait_connections_seconds }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test shutdown-aware wait
        if: env.UUREMOTE_DEBUG != '0'
        shell: bash
        run: |
            .github/workflows/apple.sh self-test-wait-connections

      - name: Test device ID logging
        if: env.UUREMOTE_DEBUG != '0'
        shell: bash
        run: |
            /bin/bash tests/test_macos_device_id_logging.sh
            python -m unittest tests.test_uuremote_wait tests.test_uuremote_desktop_finalization -v

      - name: Configure macOS host
        shell: bash
        env:
          UUREMOTE_ACCOUNT_PASSWORD: ${{ secrets.UUREMOTE_ACCOUNT_PASSWORD }}
        run: |
            if [ -z "${UUREMOTE_ACCOUNT_PASSWORD:-}" ]; then
                echo "Repository secret UUREMOTE_ACCOUNT_PASSWORD is required" >&2
                exit 2
            fi

            echo "::add-mask::${UUREMOTE_ACCOUNT_PASSWORD}"
            .github/workflows/apple.sh configure-host
            unset UUREMOTE_ACCOUNT_PASSWORD

      - name: Install GameViewer
        shell: bash
        run: |
            package_url="https://a56.gdl.netease.com/uuyc_4.35.0.pkg"
            package_path="${GITHUB_WORKSPACE}/uuyc_4.35.0.pkg"
            curl -L -o ${package_path} ${package_url}
            sudo /usr/sbin/installer -verboseR -pkg ${package_path} -target /

      - name: Launch GameViewer
        shell: bash
        run: |
            ls -l /Applications/UURemote.app/Contents/MacOS/UURemote
            brew install coreutils
            gtimeout 60s /Applications/UURemote.app/Contents/MacOS/UURemote >/dev/null 2>&1 &

            device_id_ready=0
            for ((i=1; i<=120; i++))
            do
                echo "Waiting deviceId [$i/120] ..."
                if .github/workflows/apple.sh report-device-id readiness
                then
                    device_id_ready=1
                    break
                fi
                echo "UU Remote device ID is unavailable, retrying in 500 ms" >&2
                sleep 0.5
            done

            if [ "$device_id_ready" -ne 1 ]
            then
                if [ "${UUREMOTE_DEBUG:-0}" != "0" ]; then
                    .github/workflows/apple.sh diagnose-device-id || true
                fi
                echo "UU Remote device readiness failed after 120 attempts" >&2
                exit 1
            fi
            unset device_id_ready

      - name: Configure UU Remote custom code
        shell: bash
        env:
          UUREMOTE_CUSTOM_CODE: ${{ secrets.UUREMOTE_CUSTOM_CODE }}
        run: |
            if [ -z "${UUREMOTE_CUSTOM_CODE:-}" ]; then
                echo "Repository secret UUREMOTE_CUSTOM_CODE is required" >&2
                exit 2
            fi

            echo "::add-mask::${UUREMOTE_CUSTOM_CODE}"
            .github/workflows/apple.sh set-custom-code
            unset UUREMOTE_CUSTOM_CODE

      - name: Configure UU Remote permissions
        shell: bash
        run: |
            .github/workflows/apple.sh

      - name: Verify permission idempotency
        if: env.UUREMOTE_DEBUG == '2' || env.UUREMOTE_DEBUG == '3'
        shell: bash
        run: |
            .github/workflows/apple.sh

      - name: Keep runner alive and capture diagnostics
        if: success() && env.UUREMOTE_DEBUG == '3'
        shell: bash
        run: |
            for ((sample=1; sample<=20; sample++))
            do
                printf -v label 'live-%02d' "$sample"
                echo "Capturing $label ..."
                .github/workflows/apple.sh snapshot "$label"
                sleep 15
            done

      - name: Wait connections
        if: success() && env.UUREMOTE_DEBUG == '0'
        shell: bash
        run: |
            wait_seconds="${UUREMOTE_WAIT_CONNECTIONS_SECONDS:-300}"

            if [[ ! "$wait_seconds" =~ ^-?[0-9]+$ ]]; then
                echo "wait_connections_seconds must be an integer in the range 0-21000; got: $wait_seconds" >&2
                exit 2
            fi

            if (( wait_seconds < 0 || wait_seconds > 21000 )); then
                echo "wait_connections_seconds must be in the range 0-21000; got: $wait_seconds" >&2
                exit 2
            fi

            echo "Waiting connections for $wait_seconds seconds ..."
            .github/workflows/apple.sh wait-connections "$wait_seconds"

      - name: Upload UU Remote diagnostics
        if: always() && env.UUREMOTE_DEBUG != '0'
        uses: actions/upload-artifact@v4
        with:
          name: uuremote-diagnostics
          path: ${{ runner.temp }}/uuremote-diagnostics/
          if-no-files-found: error
