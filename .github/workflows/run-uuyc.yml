name: Run UUYC

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install UUYC
        shell: pwsh
        run: |
            $packageUrl = "https://a56.gdl.netease.com/UURemote_Setup_4.36.0.9155_0806201117_gwqd.exe"
            $packagePath = Join-Path $env:GITHUB_WORKSPACE "uuyc_4.36.0.exe"
            Invoke-WebRequest -Uri $packageUrl -OutFile $packagePath
            $process = Start-Process -FilePath $packagePath -ArgumentList /S -Wait -PassThru
            if ($process.ExitCode -ne 0) {
                throw "Fail to install $packagePath"
            } else {
                Write-Host "Successfully installed $packagePath"
            }

      - name: Launch UUYC
        shell: pwsh
        run: |
            $installRoot = 'C:\Program Files\Netease\GameViewer'
            $launcherPath = Join-Path $installRoot 'GameViewer.exe'
            $cliPath = Join-Path $installRoot 'bin\uuyc-cli.exe'
            $timeoutSeconds = 60
            Write-Host "Launching $launcherPath ..."
            Start-Process -FilePath $launcherPath -WorkingDirectory $installRoot
            $deadline = (Get-Date).AddSeconds($timeoutSeconds)
            $attempts = 0
            while ($true) {
                Write-Host "Waiting $launcherPath ..."
                if ((Get-Date) -ge $deadline) {
                    throw "Wait UUYC timeout after $timeoutSeconds seconds."
                }
                Start-Sleep -Milliseconds 500
                $attempts++
                $deviceId = @(& $cliPath --device-id 2>&1)
                if ($LASTEXITCODE -ne 0) {
                    continue
                }
                Write-Host "deviceId: $deviceId"
                $customCode = 'johnDOE123'
                $process = Start-Process -FilePath $cliPath -ArgumentList @('--reset-custom-code', $customCode) -Wait -PassThru
                if ($process.ExitCode -ne 0) {
                    continue
                }
                Write-Host "customCode: $customCode"
                Write-Host "Waiting connections ..."
                Start-Sleep -Seconds 300
                break
            }
