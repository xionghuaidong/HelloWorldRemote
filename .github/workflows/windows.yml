name: Windows

on:
  workflow_dispatch:
    inputs:
      debug_level:
        description: UURemote diagnostic level (0=fast, 1=screenshots, 2=idempotency, 3=live sampling)
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
      wait_connections_seconds:
        description: Seconds to wait for remote connections (0-21000)
        required: true
        default: 300
        type: number

permissions:
  contents: write

jobs:
  run:
    runs-on: windows-latest
    env:
      UUREMOTE_DEBUG: ${{ inputs.debug_level || '0' }}
      UUREMOTE_WAIT_CONNECTIONS_SECONDS: ${{ inputs.wait_connections_seconds }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GameViewer
        shell: pwsh
        run: |
            $packageUrl = "https://a56.gdl.netease.com/UURemote_Setup_4.36.0.9155_0806201117_gwqd.exe"
            $packagePath = Join-Path $env:GITHUB_WORKSPACE "uuyc_4.36.0.exe"
            Invoke-WebRequest -Uri $packageUrl -OutFile $packagePath
            $process = Start-Process -FilePath $packagePath -ArgumentList /S -Wait -PassThru
            if ($process.ExitCode -ne 0) {
                throw "Fail to install $packagePath"
            } else {
                Write-Host "Successfully installed $packagePath"
            }

      - name: Launch GameViewer
        shell: pwsh
        run: |
            $installRoot = 'C:\Program Files\Netease\GameViewer'
            $launcherPath = Join-Path $installRoot 'GameViewer.exe'
            $cliPath = Join-Path $installRoot 'bin\uuyc-cli.exe'
            $timeoutSeconds = 60
            Write-Host "Launching $launcherPath ..."
            Start-Process -FilePath $launcherPath -WorkingDirectory $installRoot
            $deadline = (Get-Date).AddSeconds($timeoutSeconds)
            while ($true) {
                Write-Host "Waiting $launcherPath ..."
                if ((Get-Date) -ge $deadline) {
                    throw "Wait GameViewer timed out after $timeoutSeconds seconds"
                }
                Start-Sleep -Milliseconds 500
                $deviceId = @(& $cliPath --device-id 2>&1)
                if ($LASTEXITCODE -ne 0) {
                    continue
                }
                Write-Host "deviceId: $deviceId"
                break
            }

      - name: Configure UU Remote custom code
        shell: pwsh
        env:
          UUREMOTE_CUSTOM_CODE: ${{ secrets.UUREMOTE_CUSTOM_CODE }}
        run: |
            $installRoot = 'C:\Program Files\Netease\GameViewer'
            $cliPath = Join-Path $installRoot 'bin\uuyc-cli.exe'
            if ([string]::IsNullOrWhiteSpace($env:UUREMOTE_CUSTOM_CODE)) {
                throw "Repository secret UUREMOTE_CUSTOM_CODE is required"
            }
            Write-Output "::add-mask::$env:UUREMOTE_CUSTOM_CODE"
            $null = & $cliPath --reset-custom-code $env:UUREMOTE_CUSTOM_CODE 2>&1
            if ($LASTEXITCODE -ne 0) {
                throw "UU Remote custom-code configuration failed"
            }
            Remove-Item Env:\UUREMOTE_CUSTOM_CODE -ErrorAction SilentlyContinue
            Write-Host "UU Remote custom code configured"

      - name: Wait connections
        if: success() && env.UUREMOTE_DEBUG == '0'
        shell: pwsh
        run: |
            $waitSeconds = $env:UUREMOTE_WAIT_CONNECTIONS_SECONDS
            if ($waitSeconds -notmatch '^-?\d+$') {
                throw "wait_connections_seconds must be an integer in the range 0-21000; got: $waitSeconds"
            }
            $waitSeconds = [int]$waitSeconds
            if ($waitSeconds -lt 0 -or $waitSeconds -gt 21000) {
                throw "wait_connections_seconds must be in the range 0-21000; got: $waitSeconds"
            }
            Write-Host "Waiting connections for $waitSeconds seconds ..."
            Start-Sleep -Seconds $waitSeconds
