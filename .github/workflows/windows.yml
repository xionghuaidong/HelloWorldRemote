name: Windows

on:
  workflow_dispatch:
    inputs:
      debug_level:
        description: UURemote diagnostic level (0=fast, 1=screenshots, 2=idempotency, 3=live sampling)
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
      wait_connections_seconds:
        description: Seconds to wait for remote connections (0-21000)
        required: true
        default: 300
        type: number

permissions:
  contents: write

jobs:
  run:
    runs-on: windows-latest
    env:
      UUREMOTE_DEBUG: ${{ inputs.debug_level || '0' }}
      UUREMOTE_WAIT_CONNECTIONS_SECONDS: ${{ inputs.wait_connections_seconds }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test shutdown-aware wait
        if: success() && env.UUREMOTE_DEBUG != '0'
        shell: pwsh
        run: |
            & .github/workflows/windows.ps1 self-test-wait-connections
            if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
            }

      - name: Install GameViewer
        shell: pwsh
        run: |
            $packageUrl = "https://a56.gdl.netease.com/UURemote_Setup_4.36.0.9155_0806201117_gwqd.exe"
            $packagePath = Join-Path $env:GITHUB_WORKSPACE "uuyc_4.36.0.exe"
            Invoke-WebRequest -Uri $packageUrl -OutFile $packagePath
            $process = Start-Process -FilePath $packagePath -ArgumentList /S -Wait -PassThru
            if ($process.ExitCode -ne 0) {
                throw "Fail to install $packagePath"
            } else {
                Write-Host "Successfully installed $packagePath"
            }

      - name: Launch GameViewer
        shell: pwsh
        run: |
            & .github/workflows/windows.ps1 launch-and-wait-device
            if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
            }

      - name: Configure UU Remote custom code
        shell: pwsh
        env:
          UUREMOTE_CUSTOM_CODE: ${{ secrets.UUREMOTE_CUSTOM_CODE }}
        run: |
            Write-Output "::add-mask::$env:UUREMOTE_CUSTOM_CODE"
            try {
                & .github/workflows/windows.ps1 validate-custom-code
                if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                }
                & .github/workflows/windows.ps1 set-custom-code
                if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                }
            }
            finally {
                Remove-Item Env:\UUREMOTE_CUSTOM_CODE -ErrorAction SilentlyContinue
            }

      - name: Verify unattended readiness
        shell: pwsh
        run: |
            & .github/workflows/windows.ps1 verify-unattended-readiness
            if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
            }

      - name: Verify configuration idempotency
        if: success() && (env.UUREMOTE_DEBUG == '2' || env.UUREMOTE_DEBUG == '3')
        shell: pwsh
        env:
          UUREMOTE_CUSTOM_CODE: ${{ secrets.UUREMOTE_CUSTOM_CODE }}
        run: |
            Write-Output "::add-mask::$env:UUREMOTE_CUSTOM_CODE"
            try {
                & .github/workflows/windows.ps1 verify-idempotency
                if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                }
            }
            finally {
                Remove-Item Env:\UUREMOTE_CUSTOM_CODE -ErrorAction SilentlyContinue
            }

      - name: Finalize desktop and capture diagnostics
        if: success()
        shell: pwsh
        run: |
            & .github/workflows/windows.ps1 finalize-desktop
            if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
            }
            if ($env:UUREMOTE_DEBUG -ne '0') {
                & .github/workflows/windows.ps1 snapshot final-desktop
                if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                }
            }

      - name: Capture live diagnostics
        if: success() && env.UUREMOTE_DEBUG == '3'
        shell: pwsh
        run: |
            1..20 | ForEach-Object {
                $label = 'live-{0:D2}' -f $_
                & .github/workflows/windows.ps1 snapshot $label
                if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                }
                if ($_ -lt 20) {
                    Start-Sleep -Seconds 15
                }
            }

      - name: Wait connections
        if: success() && env.UUREMOTE_DEBUG == '0'
        shell: pwsh
        run: |
            & .github/workflows/windows.ps1 wait-connections "$env:UUREMOTE_WAIT_CONNECTIONS_SECONDS"
            if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
            }

      - name: Upload UU Remote diagnostics
        if: always() && env.UUREMOTE_DEBUG != '0'
        uses: actions/upload-artifact@v4
        with:
          name: uuremote-diagnostics
          path: ${{ runner.temp }}/uuremote-diagnostics/
          if-no-files-found: error
